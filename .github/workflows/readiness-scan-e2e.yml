name: readiness-scan e2e (como lo adopta un desconocido)

# La prueba de punta a punta: no ejecuta scan.mjs a mano, CONSUME la acción por referencia
# `uses:` exactamente como la escribirá cualquier repo del mundo, en los tres sistemas
# operativos que ofrece GitHub. Si el manifiesto, el shell, las comillas de la ruta, el
# runtime de Node o los separadores de ruta de Windows estuvieran mal, esto falla aquí y no
# en el pase de un tercero.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch: {}

jobs:
  adopt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Node del runner
        run: node --version

      # Caso real de adopción: un repo con criptografía clásica. Debe encontrarla.
      - name: La acción, consumida por referencia
        id: pqc
        uses: ./readiness-scan
        with:
          path: readiness-scan/test/fixtures/vulnerable
          output: cbom-e2e.json

      - name: Las salidas de la acción son utilizables
        shell: bash
        env:
          FINDINGS: ${{ steps.pqc.outputs.findings }}
          CBOM: ${{ steps.pqc.outputs.cbom }}
        run: |
          set -euo pipefail
          echo "findings=$FINDINGS cbom=$CBOM"
          test -n "$FINDINGS" || { echo "::error::la salida findings vino vacía"; exit 1; }
          test "$FINDINGS" -gt 0 2>/dev/null || { echo "::error::findings no es un entero > 0: '$FINDINGS'"; exit 1; }
          test -f "$CBOM" || { echo "::error::la salida cbom no apunta a un archivo existente"; exit 1; }
          node -e "
            const c = require('./' + process.env.CBOM.replace(/\\\\/g, '/'));
            if (c.bomFormat !== 'CycloneDX' || c.specVersion !== '1.6') throw new Error('no es CycloneDX 1.6');
            const vuln = c.components.filter(x => (x.properties||[]).some(p => p.name==='fractalai:quantum_vulnerable' && p.value==='true')).map(x=>x.name);
            if (!vuln.some(n => n.includes('RSA'))) throw new Error('no encontró RSA: ' + JSON.stringify(vuln));
            console.log('CBOM válido, familias vulnerables:', vuln.join(', '));
          "

      # El caso inverso: un repo ya post-cuántico. No debe marcar NADA.
      - name: Repo post-cuántico, sin falsos positivos
        id: clean
        uses: ./readiness-scan
        with:
          path: readiness-scan/test/fixtures/resistant
          output: cbom-clean.json

      - name: findings debe ser exactamente 0
        shell: bash
        env:
          FINDINGS: ${{ steps.clean.outputs.findings }}
        run: |
          set -euo pipefail
          test "$FINDINGS" = "0" || { echo "::error::falso positivo sobre código post-cuántico: findings=$FINDINGS"; exit 1; }
          echo "0 falsos positivos sobre ML-DSA / ML-KEM"

      # Que la puerta de corte funcione de verdad cuando alguien la activa.
      - name: fail-on-findings corta el pase
        id: gate
        continue-on-error: true
        uses: ./readiness-scan
        with:
          path: readiness-scan/test/fixtures/vulnerable
          output: cbom-gate.json
          fail-on-findings: 'true'

      - name: y su fallo es observable
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure" || { echo "::error::fail-on-findings no cortó el pase (outcome=$OUTCOME)"; exit 1; }
          echo "la puerta de corte funciona"

      # La prueba del agujero crítico que tuvo esta acción: las entradas se interpolaban dentro del
      # shell del composite, así que un repo que cableara `path` desde el título de un pull request
      # entregaba ejecución de comandos en su propio runner. Ahora viajan por el entorno. Esto lo
      # vigila para siempre: si alguien vuelve a interpolar, el archivo aparece y el pase falla.
      - name: 'Seguridad: una entrada hostil es dato, no comando'
        id: inject
        continue-on-error: true
        uses: ./readiness-scan
        with:
          path: '$(touch PWNED_RCE; echo hola)'
          output: cbom-inject.json

      - name: 'Seguridad: nada se ejecutó'
        shell: bash
        run: |
          set -euo pipefail
          if [ -e PWNED_RCE ]; then
            echo "::error::INYECCION DE COMANDOS: la entrada se ejecutó en el runner"; exit 1
          fi
          echo "la entrada hostil se trató como una ruta literal; no se ejecutó nada"

      # Y que no se pueda escribir fuera del espacio de trabajo.
      - name: 'Seguridad: la salida no escapa del espacio de trabajo'
        id: escape
        continue-on-error: true
        uses: ./readiness-scan
        with:
          path: readiness-scan/test/fixtures/vulnerable
          output: '../../../escaped.json'

      - name: 'Seguridad: el escape fue rechazado'
        shell: bash
        env:
          OUTCOME: ${{ steps.escape.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "failure" || { echo "::error::una ruta de salida fuera del workspace fue aceptada"; exit 1; }
          echo "la ruta fuera del espacio de trabajo fue rechazada"

      # Un repositorio grande y real, para medir que escala.
      - name: 'Escala: el repo entero, con tiempo medido'
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          node readiness-scan/scan.mjs --path=. --output=cbom-full.json
          echo "segundos: $(( $(date +%s) - start ))"

  # La prueba definitiva de adopción: consumir la referencia PUBLICADA, resuelta por GitHub desde
  # la etiqueta, exactamente como la escribirá cualquier repositorio del planeta. El trabajo de
  # arriba usa ./readiness-scan, que prueba el código pero no prueba que la línea del README
  # funcione: eso depende de que la etiqueta contenga la acción y de que GitHub resuelva un
  # action.yml en un subdirectorio. Es justamente lo que estaba roto (la etiqueta v2 no la
  # contenía), así que se vigila aquí.
  stranger:
    name: la línea del README, tal cual
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: pqc
        uses: johnInarti/pqc-receipt-verify-action/readiness-scan@v2.1.0
        with:
          path: readiness-scan/test/fixtures/vulnerable
          output: cbom-published.json

      - name: Las salidas sirven y el CBOM es real
        shell: bash
        env:
          FINDINGS: ${{ steps.pqc.outputs.findings }}
          CBOM: ${{ steps.pqc.outputs.cbom }}
        run: |
          set -euo pipefail
          echo "findings=$FINDINGS cbom=$CBOM"
          test "$FINDINGS" -gt 0
          test -f "$CBOM"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.CBOM, "utf8"));
            if (c.specVersion !== "1.6") throw new Error("no es CycloneDX 1.6");
            const vuln = c.components.filter(x => (x.properties||[]).some(p => p.name === "fractalai:quantum_vulnerable" && p.value === "true"));
            if (!vuln.some(x => x.name.includes("RSA"))) throw new Error("no encontro RSA");
            console.log("la referencia publicada funciona:", vuln.map(x => x.name).join(", "));
          '
