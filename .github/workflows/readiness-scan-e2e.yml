name: readiness-scan forwarder

# La copia en subdirectorio de esta acción ya no lleva código: es un REENVÍO a
# johnInarti/pqc-readiness-action, que es donde viven el escáner, sus 55 pruebas y su registro de
# cambios. Lo único que hay que vigilar aquí es que el reenvío siga funcionando, porque hay
# workflows ajenos que todavía escriben la línea antigua y no deben romperse nunca.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  forwarder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: La línea antigua sigue funcionando
        id: pqc
        uses: ./readiness-scan
        with:
          path: .
          output: cbom-forwarded.json
          sarif: ''

      - name: Y devuelve las mismas salidas
        shell: bash
        env:
          FINDINGS: ${{ steps.pqc.outputs.findings }}
          CBOM: ${{ steps.pqc.outputs.cbom }}
          TRUNCATED: ${{ steps.pqc.outputs.truncated }}
        run: |
          set -euo pipefail
          echo "findings=$FINDINGS cbom=$CBOM truncated=$TRUNCATED"
          test -n "$FINDINGS" || { echo "::error::el reenvío no devolvió findings"; exit 1; }
          test -f "$CBOM"    || { echo "::error::el reenvío no escribió el CBOM"; exit 1; }
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.CBOM, "utf8"));
            if (c.bomFormat !== "CycloneDX" || c.specVersion !== "1.6") throw new Error("no es CycloneDX 1.6");
            console.log("el reenvío produce un CBOM válido con", c.components.length, "componentes");
          '
